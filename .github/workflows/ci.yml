name: CI

# push/PR 검증 게이트 — 이전엔 `deploy-pages.yml`/`publish-npm.yml`만 있어 머지 전 검증
# 지점이 없었다. `pnpm check`(로컬 게이트)도 `type-check:core`만 돌아 designer/viewer/site의
# 타입 에러를 놓쳤다(`pnpm type-check:all`을 직접 돌리면 드러남) — 이 워크플로는 그 사각지대를
# 없애기 위해 `pnpm check`(= build:all + type-check:all + test:packages)를 그대로 돈다.
#
# Build은 Type-check보다 먼저 돈다: viewer/designer가 `@canvas-kit/core`를 `workspace:*`로
# 참조하고 core의 `types`는 빌드 산출물(`dist/index.d.ts`)을 가리키므로, clean checkout에서
# core가 먼저 빌드되지 않으면 viewer/designer의 `tsc --noEmit`이 항상
# `Cannot find module '@canvas-kit/core'`로 실패한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand on main: finishes a release whose run cannot be re-run. Publishing stays as safe as on a
  # push — it only ever publishes versions npm does not have yet.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not, because a run on main may be in the
  # middle of the `publish` job below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Cheapest checks first. Dependencies behind already-published versions fail here; a new
      # major must be adopted or deferred with a review date in dependency-deferrals.json
      # (scripts/check-dependency-drift.mjs). Also runs weekly (dependency-drift.yml).
      - name: Tooling script tests
        run: pnpm test:tooling

      - name: Dependency drift
        run: pnpm check:dependency-drift

      - name: Lint
        run: pnpm lint

      # Private working context (tracking ids, local paths, hosts off the allowlist in
      # public-text.json) must not reach this public repository (scripts/check-public-text.mjs).
      - name: Public text
        run: pnpm check:public-text

      - name: Build (all packages + site)
        run: pnpm build:all

      # Published type declarations must resolve under every module mode (node16 ESM included).
      - name: Package types (attw)
        run: pnpm check:package-types

      - name: Type-check (all packages + site)
        run: pnpm type-check:all

      - name: Test (all packages)
        run: pnpm test:packages

  # Releasing is a commit on main that bumps a package's version and renames its `## [Unreleased]`
  # changelog section to that version (scripts/changelog-versions.test.mjs holds the two together).
  # Once that commit passes `verify`, this job publishes every package whose version npm does not
  # have yet — core first, since viewer and designer depend on the core version they were built with.
  publish:
    name: publish
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for npm provenance (NPM_CONFIG_PROVENANCE below).
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Only npm's 404 means "not published yet"; any other failure (registry down, rate limit) stops
      # here instead of trying to publish a version that may already exist.
      - name: Find versions not yet on npm
        id: pending
        run: |
          pending=""
          for dir in core viewer designer; do
            name=$(node -p "require('./packages/${dir}/package.json').name")
            version=$(node -p "require('./packages/${dir}/package.json').version")
            if out=$(npm view "${name}@${version}" version 2>&1); then
              echo "- \`${name}@${version}\` — already published" >> "$GITHUB_STEP_SUMMARY"
            elif grep -q E404 <<< "${out}"; then
              pending="${pending} ${dir}"
            else
              echo "${out}" >&2
              echo "::error::Could not ask npm whether ${name}@${version} is published"
              exit 1
            fi
          done
          echo "dirs=${pending# }" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.pending.outputs.dirs != ''
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: steps.pending.outputs.dirs != ''
        run: pnpm --filter "@canvas-kit/*" build

      # pnpm rewrites `workspace:*` to the exact core version in the published manifest.
      - name: Publish
        if: steps.pending.outputs.dirs != ''
        env:
          DIRS: ${{ steps.pending.outputs.dirs }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          for dir in ${DIRS}; do
            name=$(node -p "require('./packages/${dir}/package.json').name")
            version=$(node -p "require('./packages/${dir}/package.json').version")
            # A prerelease goes out under `next`, never as `latest` (npm refuses one without a tag).
            case "${version}" in *-*) tag=next ;; *) tag=latest ;; esac
            pnpm --filter "${name}" publish --no-git-checks --tag "${tag}"
            echo "- \`${name}@${version}\` — published (${tag})" >> "$GITHUB_STEP_SUMMARY"
          done
