name: CI

# push/PR 검증 게이트 — 이전엔 `deploy-pages.yml`/`publish-npm.yml`만 있어 머지 전 검증
# 지점이 없었다. `pnpm check`(로컬 게이트)도 `type-check:core`만 돌아 designer/viewer/site의
# 타입 에러를 놓쳤다(`pnpm type-check:all`을 직접 돌리면 드러남) — 이 워크플로는 그 사각지대를
# 없애기 위해 `pnpm check`(= build:all + type-check:all + test:packages)를 그대로 돈다.
#
# Build은 Type-check보다 먼저 돈다: viewer/designer가 `@canvas-kit/core`를 `workspace:*`로
# 참조하고 core의 `types`는 빌드 산출물(`dist/index.d.ts`)을 가리키므로, clean checkout에서
# core가 먼저 빌드되지 않으면 viewer/designer의 `tsc --noEmit`이 항상
# `Cannot find module '@canvas-kit/core'`로 실패한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Cheapest checks first. Dependencies behind already-published versions fail here; a new
      # major must be adopted or deferred with a review date in dependency-deferrals.json
      # (scripts/check-dependency-drift.mjs). Also runs weekly (dependency-drift.yml).
      - name: Tooling script tests
        run: pnpm test:tooling

      - name: Dependency drift
        run: pnpm check:dependency-drift

      - name: Lint
        run: pnpm lint

      # Private working context (tracking ids, local paths, hosts off the allowlist in
      # public-text.json) must not reach this public repository (scripts/check-public-text.mjs).
      - name: Public text
        run: pnpm check:public-text

      - name: Build (all packages + site)
        run: pnpm build:all

      # Published type declarations must resolve under every module mode (node16 ESM included).
      - name: Package types (attw)
        run: pnpm check:package-types

      - name: Type-check (all packages + site)
        run: pnpm type-check:all

      - name: Test (all packages)
        run: pnpm test:packages
