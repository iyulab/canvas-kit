name: Deploy Canvas-Kit Site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'site/**'
      - 'packages/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Next.js cache
        uses: actions/cache@v6
        with:
          path: site/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next

      # Every step fails the job when it fails: a broken build must not deploy (an earlier version of
      # this workflow swallowed build errors and published a placeholder page instead).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the packages, then the site. site/next.config.ts switches to a static export under the
      # repository's base path when GITHUB_ACTIONS is set, which Actions always does.
      - name: Build packages and site
        run: pnpm build:all

      - name: Check the static export
        run: test -f site/out/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/out
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5